name: Build Executable

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:      # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: PyInstaller 打包
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "youtube_user" `
            --icon mage.ico `
            --add-data "config_pub.json;." `
            --add-data "country.json;." `
            --add-data "mage.ico;." `
            src/youtube_user.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: youtube_user-windows
          path: dist/youtube_user.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: PyInstaller 打包
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "youtube_user" \
            --icon mage.ico \
            --add-data "config_pub.json:." \
            --add-data "country.json:." \
            --add-data "mage.ico:." \
            src/youtube_user.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: youtube_user-macos
          path: dist/youtube_user
          retention-days: 30

  create-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: youtube_user-windows

      - uses: actions/download-artifact@v4
        with:
          name: youtube_user-macos
          path: macos/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            youtube_user.exe
            macos/youtube_user
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
